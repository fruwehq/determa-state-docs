site_name: Determa State documentation
site_description: Determa State manual and beginner-friendly runnable tutorials
site_url: https://fruwehq.github.io/determa-state-docs/
repo_url: https://github.com/fruwehq/determa-state-docs
repo_name: fruwehq/determa-state-docs
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Start: index.md
  - Getting started:
      - Your first machine: getting-started/first-machine.md
  - Guides:
      - Core statecharts: guides/core-statecharts.md
      - CEL and actions: guides/cel-and-actions.md
      - Components and spawning: guides/components-and-spawning.md
      - Effects, faults, and hosting: guides/effects-faults-hosting.md
      - Persistence and migration: guides/persistence-and-migration.md
  - Reference:
      - Coverage status: reference/coverage.md
