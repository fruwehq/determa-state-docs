name: Validate documentation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tutorial
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Fetch pinned Determa State sources
        run: make sources

      - name: Install candidate Python engine from pinned source
        run: python scripts/install_candidate.py

      - name: Validate public source identity and release freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_latest.py

      - name: Validate tutorials and build site
        run: make check
