name: Validate and publish

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out tutorial
        uses: actions/checkout@v7

      - name: Check out specification
        uses: actions/checkout@v7
        with:
          repository: fruwehq/determa-state-spec
          ref: c1635d74e6a216301a8986d37be8ce7e7111dfd7
          path: .sources/determa-state-spec

      - name: Check out conformance
        uses: actions/checkout@v7
        with:
          repository: fruwehq/determa-state-conformance
          ref: 600523ca08c3b8a6ee790439a32dc4ce47f71b95
          path: .sources/determa-state-conformance

      - name: Check out Python engine
        uses: actions/checkout@v7
        with:
          repository: fruwehq/determa-state-python
          ref: 7b17d788b48049648e7e463aa3d35ba13dc1aa6e
          path: .sources/determa-state-python

      - name: Check out Rust engine
        uses: actions/checkout@v7
        with:
          repository: fruwehq/determa-state-rust
          ref: d17480c8b281dcd17953f59afcf6b5d23ff44efd
          path: .sources/determa-state-rust

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate released version is current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_latest.py

      - name: Validate tutorials and build site
        run: make check

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
